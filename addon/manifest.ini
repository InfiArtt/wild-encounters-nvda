name = wildEncounters
summary = "Wild Encounters"
description = """A sweet, ambient Pokémon fan add-on, not a game. Now and then NVDA tells you which wild Pokémon is around you, from the real weather, time of day and moon at your home ("It's raining over Batam... a Wingull is gliding just above the rooftops near you"), with a sound for each kind. Look around yourself with NVDA+Alt+O, then W, every 20 minutes, or let them come by themselves when the weather changes (at most one to three a day, never in your quiet hours). Everyone you meet goes into your Field Journal. Set your home with a map link, coordinates or a city. English only. Free and unofficial: not affiliated with, endorsed or sponsored by Nintendo, Game Freak, Creatures or The Pokémon Company. Pokémon and Pokémon character names are trademarks of Nintendo. Data from PokéAPI."""
author = "Rafli"
version = 1.0.2
docFileName = readme.html
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.2
url = https://github.com/InfiArtt/wild-encounters-nvda
